Generate consolidated changelog:
  extends: .rules-rc-release
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize

  script:
    - python3 scripts/consolidate_changelog.py

Deploy MkDocs pages:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Ensure origin remote is configured with gitlab-ci-token for pushing
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - *setup_mkdocs_steps
    - cd $CI_PROJECT_DIR
    - export ENABLE_PDF_EXPORT=1
    - git branch -D gh-pages || true
    - git fetch origin gh-pages:gh-pages || true
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: "Generate consolidated changelog"
      optional: true
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Deploying versioned docs for $CI_COMMIT_TAG and updating 'latest' alias"
        uv run mike deploy $CI_COMMIT_TAG latest -p -r origin -b gh-pages --update-aliases
      else
        echo "Deploying latest docs from master branch"
        uv run mike deploy latest -p -r origin -b gh-pages
      fi

Announce release on Slack:
  extends: .rules-rc-release
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize
  needs:
    - job: "Generate consolidated changelog"
    - job: "Deploy MkDocs pages"
      optional: true
  before_script:
    - git fetch origin master --quiet
    - git checkout origin/master -- docs/about/CHANGELOG.md
  script:
    - VERSION="$CI_COMMIT_TAG"
    - DATE=$(grep -m1 "^## ${VERSION} - " docs/about/CHANGELOG.md | sed 's/.* - //')
    - |
      if [ -z "$DATE" ]; then
        echo "Could not find changelog entry for $VERSION — skipping Slack notification."
        exit 0
      fi
    - ANCHOR="$(echo "$VERSION" | tr -d '.' | tr 'A-Z' 'a-z')-${DATE}"
    - URL="https://docs.waldur.com/latest/about/CHANGELOG/"
    - |
      case "$VERSION" in
        *-rc*)
          echo "This is a Release Candidate ($VERSION). Skipping public URL live check."
          ;;
        *)
          echo "Waiting for anchor #${ANCHOR} to appear at ${URL} ..."
          ok=0
          attempts=30
          for i in $(seq 1 "$attempts"); do
            if curl -sf --max-time 10 \
                 -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
                 "${URL}?ts=$(date +%s)" | grep -q "id=\"${ANCHOR}\""; then
              echo "Anchor ${ANCHOR} is live (attempt $i)"
              ok=1
              break
            fi
            echo "Anchor not yet live (attempt $i/${attempts}); sleeping 30s"
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "Anchor ${ANCHOR} never appeared after 15 minutes; skipping Slack notification."
            echo "The job can be re-run manually from GitLab once docs.waldur.com/latest is rebuilt."
            exit 0
          fi
          ;;
      esac
    - python3 scripts/publish-release-slack.py "$VERSION"
