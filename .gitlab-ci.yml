Run linters:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  stage: test
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - uvx prek run --all-files

Scan Python dependencies:
  extends: .Vulnerability scan template
  variables:
    LOCKFILE_PATH: "uv.lock"
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.setup_mkdocs_steps: &setup_mkdocs_steps
  - pip install uv
  - uv sync --frozen
  # mkdocs-material and mkdocs-materialx both claim the `material/` namespace and
  # ship different `partials/header.html` files keyed to their respective plugin
  # names. Force materialx to win the file race so `materialx/search` renders.
  - uv pip install --reinstall --no-deps mkdocs-materialx
  # Install d2 binary (required by mkdocs-d2-plugin to render concept-page diagrams)
  - curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
  - export PATH="$HOME/.local/bin:$PATH"
  # Generate llms-full.txt for LLM-friendly documentation access
  - python scripts/generate-llms-txt.py

Test mkdocs:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: test
  # Also gate master pushes (e.g. release changelog commits), not just MRs —
  # otherwise a broken relative link lands on master and fails every open MR.
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  script:
    # Fast pre-check with a clear message before the slow full build.
    - python scripts/check-changelog-api-links.py
    - python3 -m unittest scripts/test_generate_enhanced_changelog.py
    - *setup_mkdocs_steps
    - uv run mkdocs build --strict --site-dir test

Test Docker Compose deployment before tagging:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  trigger:
    waldur/waldur-docker-compose

Test Helm deployment before tagging:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  trigger:
    waldur/waldur-helm

Test changelog generation:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    CI_COMMIT_TAG_MESSAGE: "Tag message"
    CI_RELEASE_DESCRIPTION: "Release description"
    CI_COMMIT_TAG: "v10.0.0"
  script:
    - export VERSION=${CI_COMMIT_TAG}
    - PREV_TAG=$(grep -m 1 "^## " docs/about/CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
    - echo "Testing enhanced changelog generation for $VERSION (since $PREV_TAG)"
    - python3 scripts/generate_enhanced_changelog_multi_repo.py $VERSION $PREV_TAG | sed -n '/^## /,/^---$/p' | head -n -1 > /tmp/new_entry.md
    - echo "Generated enhanced changelog entry:"
    - cat /tmp/new_entry.md

# This job acts as an architectural "bridge" to decouple downstream pipelines.
# Instead of cloning and building the heavy waldur-mastermind repo here (which requires
# installing LDAP, xmlsec, and system libraries), we download the pre-built schema artifacts
# directly from waldur-mastermind's latest develop pipeline.
#
# Why this design?
# 1. Decouples SDK pipelines (js-client, py-client, etc.) so they fetch schemas from the parent
#    pipeline ID ($CI_PARENT_PIPELINE_ID) instead of hardcoding a direct dependency on mastermind.
# 2. Centralizes the git push logic to commit the versioned schema (e.g. waldur-openapi-schema-X.Y.Z.yaml)
#    back to waldur-docs during stable releases, which trigger jobs cannot do.
# 3. Keeps orchestrator runner images lightweight (alpine/git instead of python + system deps).
Generate OpenAPI schema:
  extends: .rules-sdk-release
  image:
    name: registry.hpc.ut.ee/mirror/alpine/git:latest
    entrypoint: [""]
  stage: schema
  variables:
    MASTERMIND_REF: "develop"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $BUILD_SDK == "true"'
      variables:
        MASTERMIND_REF: "develop"
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK == "true"'
      variables:
        MASTERMIND_REF: "develop"
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      variables:
        MASTERMIND_REF: "$CI_COMMIT_TAG"
  needs: []
  script:
    - |
      apk add --no-cache curl jq
      fetch_schema() {
        local filename="$1"
        
        download_with_token() {
          local token_header="$1"
          local token_val="$2"
          
          # 1. Try direct API download by ref (simplest, uses latest successful pipeline)
          echo "Attempting direct API download by ref $MASTERMIND_REF..."
          if curl --fail --show-error --silent -L --header "${token_header}: ${token_val}" \
            "https://code.opennodecloud.com/api/v4/projects/waldur%2Fwaldur-mastermind/jobs/artifacts/$MASTERMIND_REF/raw/${filename}?job=Generate%20OpenAPI%20schema" -o "${filename}"; then
            echo "Successfully fetched ${filename} using direct API ref download."
            return 0
          fi
          
          # 2. Try direct Web URL download by ref (works with repo-only tokens)
          echo "Direct API download failed. Attempting web URL download by ref $MASTERMIND_REF..."
          if curl --fail --show-error --silent -L --header "${token_header}: ${token_val}" \
            "https://code.opennodecloud.com/waldur/waldur-mastermind/-/jobs/artifacts/$MASTERMIND_REF/raw/${filename}?job=Generate%20OpenAPI%20schema" -o "${filename}"; then
            echo "Successfully fetched ${filename} using web URL ref download."
            return 0
          fi
          
          # 3. Fallback: Query pipelines to find the latest successful job on the ref
          echo "Direct download options failed. Querying pipelines for ref $MASTERMIND_REF..."
          local pipelines_url="https://code.opennodecloud.com/api/v4/projects/waldur%2Fwaldur-mastermind/pipelines?ref=$MASTERMIND_REF"
          local pipelines_json
          pipelines_json=$(curl --fail --silent --header "${token_header}: ${token_val}" "$pipelines_url" 2>/dev/null)
          
          if [ -n "$pipelines_json" ] && [ "$pipelines_json" != "[]" ]; then
            local pipeline_ids
            pipeline_ids=$(echo "$pipelines_json" | jq -r '.[0:5][].id' 2>/dev/null)
            for pipeline_id in $pipeline_ids; do
              if [ -n "$pipeline_id" ] && [ "$pipeline_id" != "null" ]; then
                echo "Checking pipeline ID: $pipeline_id for successful Generate OpenAPI schema job..."
                local jobs_url="https://code.opennodecloud.com/api/v4/projects/waldur%2Fwaldur-mastermind/pipelines/${pipeline_id}/jobs"
                local jobs_json
                jobs_json=$(curl --fail --silent --header "${token_header}: ${token_val}" "$jobs_url" 2>/dev/null)
                if [ -n "$jobs_json" ]; then
                  local job_id
                  job_id=$(echo "$jobs_json" | jq -r '.[] | select(.name == "Generate OpenAPI schema" and .status == "success") | .id' 2>/dev/null)
                  if [ -n "$job_id" ] && [ "$job_id" != "null" ]; then
                    echo "Found job ID: $job_id in pipeline $pipeline_id. Downloading artifact..."
                    if curl --fail --show-error --silent -L --header "${token_header}: ${token_val}" \
                      "https://code.opennodecloud.com/api/v4/projects/waldur%2Fwaldur-mastermind/jobs/${job_id}/artifacts/raw/${filename}" -o "${filename}"; then
                      echo "Successfully fetched ${filename} using job ID."
                      return 0
                    fi
                  fi
                fi
              fi
            done
          fi
          return 1
        }

        if download_with_token "JOB-TOKEN" "$CI_JOB_TOKEN"; then
          return 0
        else
          echo "JOB-TOKEN download failed, trying GITLAB_TOKEN..."
          if download_with_token "PRIVATE-TOKEN" "$GITLAB_TOKEN"; then
            return 0
          else
            echo "ERROR: Failed to fetch ${filename}"
            return 1
          fi
        fi
      }
      fetch_schema waldur-openapi-schema.yaml
      fetch_schema waldur-typescript-schema.yaml
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Generated OpenAPI schema for ${CI_COMMIT_TAG}, committing to waldur-docs"
        mkdir -p docs/API
        cp waldur-openapi-schema.yaml docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml
        git config --global user.name "$GITLAB_USER_NAME"
        git config --global user.email "$GITLAB_USER_EMAIL"
        git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git fetch origin master
        git checkout master
        git pull
        git add docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml
        git diff --cached --quiet && echo "OpenAPI schema already committed" || (git commit -m "Add OpenAPI schema for ${CI_COMMIT_TAG}" && git pull --rebase origin master && git push -o ci.skip origin master)
      fi
  artifacts:
    paths:
      - waldur-openapi-schema.yaml
      - waldur-typescript-schema.yaml
    expire_in: 1 day

Release Waldur Mastermind:
  extends: .rules-rc-release
  stage: release
  variables:
    SKIP_TESTS: "true"
  trigger:
    project: waldur/waldur-mastermind
    branch: develop
    strategy: depend

Release Waldur Homeport:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-homeport
    branch: develop
    strategy: depend

Release Waldur Helm:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-helm
    branch: master
    strategy: depend

Release Waldur Docker Compose:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-docker-compose
    branch: develop
    strategy: depend

Release Waldur Prometheus Exporter:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-prometheus-exporter
    branch: develop
    strategy: depend

Generate and release API docs:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/api-docs
    branch: main
    strategy: depend

Generate and release Python SDK:
