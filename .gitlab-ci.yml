include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/check-merge-compatibility.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/test/vulnerability-scan.yml"
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"
  - .gitlab-ci-external-sync.yml

variables:
  BUILD_SDK:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Set to true to run only the SDK schema and client generation stage."

stages:
  - test
  - release
  - schema
  - sdks
  - infrastructure
  - finalize

# ---------------------------------------------------------------------------
# Shared CI/CD Rules Templates
# ---------------------------------------------------------------------------
.rules-stable-release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  variables:
    RELEASE_VERSION: "$CI_COMMIT_TAG"

.rules-rc-release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  variables:
    RELEASE_VERSION: "$CI_COMMIT_TAG"

.rules-sdk-release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $BUILD_SDK == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BUILD_SDK == "true"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  variables:
    RELEASE_VERSION: "$CI_COMMIT_TAG"

.sdk-trigger-base:
  extends: .rules-sdk-release
  stage: sdks
  # Wait for the schema to exist before generating anything from it. With the
  # previous `needs: []` these triggers fired at pipeline creation — minutes
  # before waldur-mastermind's tag pipeline had built the schema — so every SDK
  # hit the `.fetch-openapi-schema` fallback and generated against the PREVIOUS
  # release's schema without any error. In 8.1.0 that shipped a Go and a Rust
  # client with the whole release's API surface missing.
  #
  # `optional: true` keeps the BUILD_SDK web/schedule pipelines working, where
  # `Generate OpenAPI schema` is not created (its rules match stable tags only)
  # and the dependency simply drops away.
  needs:
    - job: "Generate OpenAPI schema"
      optional: true
      artifacts: false

