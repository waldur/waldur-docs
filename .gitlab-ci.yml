Run linters:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  stage: test
  interruptible: true
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  script:
    - uvx prek run --all-files

Scan Python dependencies:
  extends: .Vulnerability scan template
  interruptible: true
  variables:
    LOCKFILE_PATH: "uv.lock"
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$SKIP_TESTS == "true" || $SKIP_TESTS == "yes"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.setup_mkdocs_steps: &setup_mkdocs_steps
  - pip install uv
  - uv sync --frozen
  # mkdocs-material and mkdocs-materialx both claim the `material/` namespace and
  # ship different `partials/header.html` files keyed to their respective plugin
  # names. Force materialx to win the file race so `materialx/search` renders.
  - uv pip install --reinstall --no-deps mkdocs-materialx
  # Install d2 binary (required by mkdocs-d2-plugin to render concept-page diagrams)
  - curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
  - export PATH="$HOME/.local/bin:$PATH"
  # Generate llms-full.txt for LLM-friendly documentation access
  - python scripts/generate-llms-txt.py

Test mkdocs:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: test
  interruptible: true
  # Also gate master pushes (e.g. release changelog commits), not just MRs —
  # otherwise a broken relative link lands on master and fails every open MR.
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  script:
    # Fast pre-check with a clear message before the slow full build.
    - python scripts/check-changelog-api-links.py
    - python3 -m unittest scripts/test_generate_enhanced_changelog.py
    - *setup_mkdocs_steps
    - uv run mkdocs build --strict --site-dir test

Test Docker Compose deployment before tagging:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  trigger:
    waldur/waldur-docker-compose

Test Helm deployment before tagging:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+(-rc\.\d+)?$/'
  trigger:
    waldur/waldur-helm

Test changelog generation:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    CI_COMMIT_TAG_MESSAGE: "Tag message"
    CI_RELEASE_DESCRIPTION: "Release description"
    CI_COMMIT_TAG: "v10.0.0"
  script:
    - export VERSION=${CI_COMMIT_TAG}
    - PREV_TAG=$(grep -m 1 "^## " docs/about/CHANGELOG.md | sed 's/^## \([^ ]*\).*/\1/')
    - echo "Testing enhanced changelog generation for $VERSION (since $PREV_TAG)"
    - python3 scripts/generate_enhanced_changelog_multi_repo.py $VERSION $PREV_TAG | sed -n '/^## /,/^---$/p' | head -n -1 > /tmp/new_entry.md
    - echo "Generated enhanced changelog entry:"
    - cat /tmp/new_entry.md

# This job acts as an architectural "bridge" to decouple downstream pipelines.
# Instead of cloning and building the heavy waldur-mastermind repo here (which requires
# installing LDAP, xmlsec, and system libraries), we download the pre-built schema artifacts
# directly from waldur-mastermind's latest develop pipeline.
#
# Why this design?
# 1. Decouples SDK pipelines (js-client, py-client, etc.) so they fetch schemas from the parent
#    pipeline ID ($CI_PARENT_PIPELINE_ID) instead of hardcoding a direct dependency on mastermind.
# 2. Centralizes the git push logic to commit the versioned schema (e.g. waldur-openapi-schema-X.Y.Z.yaml)
#    back to waldur-docs during stable releases, which trigger jobs cannot do.
# 3. Keeps orchestrator runner images lightweight (alpine/git instead of python + system deps).
Generate OpenAPI schema:
  extends: .fetch-openapi-schema
  stage: schema
  # Commits the schema and changelog link back to master; serialised against
  # sync-external-docs, which pushes the same ref.
  resource_group: master-push
  variables:
    DOWNLOAD_TYPESCRIPT_SCHEMA: "true"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  # Pinned explicitly, for two reasons. The schema is fetched from
  # waldur-mastermind's pipeline *for this tag*, which does not exist until the
  # release stage has tagged mastermind — start earlier and the fetch template
  # silently falls back to the previous release's schema. And
  # `.fetch-openapi-schema` carries `needs: []`, which `extends` would otherwise
  # inherit here, letting this job start immediately at pipeline creation.
  needs:
    - job: "Release Waldur Mastermind"
      artifacts: false
  script:
    # The needs above only guarantee mastermind has been *tagged*; the job that
    # builds its schema lives in a separate tag pipeline and takes minutes
    # longer. Fetching before it finishes is what triggered the stale-schema
    # fallback in 8.1.0, so wait for it explicitly.
    - python3 scripts/wait-for-mastermind-schema.py "${CI_COMMIT_TAG}"
    - !reference [.fetch-openapi-schema, script]
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Generated OpenAPI schema for ${CI_COMMIT_TAG}, committing to waldur-docs"
        # Fail loudly if the fetch fell back to the previous release's schema —
        # that fallback exits 0, so it is indistinguishable from success here.
        python3 scripts/verify-openapi-schema.py "${CI_COMMIT_TAG}" waldur-openapi-schema.yaml
        # `.fetch-openapi-schema` pins python:3.13-alpine, which ships no git,
        # so install it before the commit-and-push below.
        apk add --no-cache git
        git --version
        mkdir -p docs/API
        cp waldur-openapi-schema.yaml docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml
        git config --global user.name "$GITLAB_USER_NAME"
        git config --global user.email "$GITLAB_USER_EMAIL"
        git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git fetch origin master
        # Point local master at the freshly fetched ref in one step. The job
        # runs on a detached HEAD at the tag, so `git checkout master` creates
        # a local branch with no upstream and the bare `git pull` that used to
        # follow died with "There is no tracking information for the current
        # branch" — which is exactly how the 8.1.1 release failed.
        git checkout -B master origin/master
        # Add the changelog's schema link in the SAME commit as the schema
        # file. release.sh deliberately leaves it out: until this job runs
        # there is nothing to point at, and a dangling relative link aborts
        # `mkdocs build --strict` on master and in every open MR.
        python3 scripts/add-changelog-api-link.py "${CI_COMMIT_TAG}"
        git add docs/API/waldur-openapi-schema-${CI_COMMIT_TAG}.yaml docs/about/CHANGELOG.md
        git diff --cached --quiet && echo "OpenAPI schema already committed" || (git commit -m "Add OpenAPI schema for ${CI_COMMIT_TAG}" && git pull --rebase origin master && git push -o ci.skip origin master)
      fi

Release Waldur Mastermind:
  extends: .rules-rc-release
  stage: release
  variables:
    SKIP_TESTS: "true"
  trigger:
    project: waldur/waldur-mastermind
    branch: develop
    strategy: depend

# Runs in the `release` stage (alongside Mastermind), not `infrastructure`, so the
# image producers always finish before the consumers (Docker Compose, Helm) that
# pull those tags. Prevents consumers from pinning/pulling an image that a failed
# or incomplete component release never published.
Release Waldur Homeport:
  extends: .rules-rc-release
  stage: release
  trigger:
    project: waldur/waldur-homeport
    branch: develop
    strategy: depend

Release Waldur Helm:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-helm
    branch: master
    strategy: depend

Release Waldur Docker Compose:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-docker-compose
    branch: develop
    strategy: depend

Release Waldur Prometheus Exporter:
  extends: .rules-rc-release
  stage: infrastructure
  trigger:
    project: waldur/waldur-prometheus-exporter
    branch: develop
    strategy: depend

Generate and release Waldur CLI:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/waldur-cli-generator
    branch: main
    strategy: depend

Generate and release API docs:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/api-docs
    branch: main
    strategy: depend

Generate and release Python SDK:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/py-client
    branch: main
    strategy: depend

Generate and release TypeScript SDK:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/js-client
    branch: main
    strategy: depend

Generate and release Go SDK:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/go-client
    branch: main
    strategy: depend

Generate and release Rust SDK:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/rs-client
    branch: main
    strategy: depend

Generate and release Terraform provider:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/terraform-provider-waldur-generator
    branch: main
    strategy: depend

Generate and release Ansible collection:
  extends: .sdk-trigger-base
  trigger:
    project: waldur/ansible-waldur-generator
    branch: main
    strategy: depend

Generate consolidated changelog:
  extends: .rules-rc-release
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize

  script:
    - python3 scripts/consolidate_changelog.py

Deploy MkDocs pages:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize
  # mike force-pushes gh-pages. Two overlapping master pipelines both deploying
  # made one fail with `gh-pages (fetch first)` during the 8.1.0 release.
  resource_group: gh-pages
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # docs.waldur.com is GitHub Pages, served from the gh-pages branch of
    # github.com/waldur/waldur-docs — so the rendered site must be pushed there.
    # Deploying to GitLab's own gh-pages is a dead end: nothing serves it, and the
    # GitLab->GitHub push mirror does not carry the force-rewritten gh-pages branch.
    - echo "[+] Adding GitHub deploy key"
    - mkdir -p ~/.ssh
    - cat "$SSH_JENKINS_GITHUB_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - cat "$SSH_JENKINS_GITHUB_PUBLIC_KEY" | tr -d '\r' > ~/.ssh/id_rsa.pub
    - chmod 600 ~/.ssh/id_rsa ~/.ssh/id_rsa.pub
    - ssh-keyscan -H "github.com" >> ~/.ssh/known_hosts
    - git remote add github_waldur git@github.com:waldur/waldur-docs.git || true
    - *setup_mkdocs_steps
    - cd $CI_PROJECT_DIR
    - export ENABLE_PDF_EXPORT=1
    # Fetch GitHub's existing gh-pages so mike updates the `latest` alias on top of
    # it, preserving the tagged-version doc sets (8.0.x) and the CNAME already there.
    - git branch -D gh-pages || true
    - git fetch github_waldur gh-pages || true
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: "Generate consolidated changelog"
      optional: true
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "Deploying versioned docs for $CI_COMMIT_TAG and updating 'latest' alias"
        # No `latest` alias here. The master branch below deploys a version
        # literally named `latest`, so asking mike to make `latest` an alias of
        # this tag fails with "alias 'latest' already specified as a version"
        # — which is why no versioned docs have been published since 8.0.8.
        # Deploy the version alone; docs.waldur.com/latest/ keeps being served
        # by the master deploy, which is what it has always been.
        uv run mike deploy $CI_COMMIT_TAG -p -r github_waldur -b gh-pages
      else
        echo "Deploying latest docs from master branch"
        uv run mike deploy latest -p -r github_waldur -b gh-pages
      fi

# Nothing used to assert that a release finished. A failed or skipped job
# leaves the pipeline red but silent about *what* is missing, and skipped jobs
# are not failures at all — 8.1.0 shipped with Helm, Docker Compose and the
# Prometheus exporter unreleased and docs.waldur.com/8.1.0/ at 404, and the
# gap was found by hand days later. This states the outcome plainly.
Verify release completed:
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize
  rules:
    # `when: always` and no `needs` on purpose. A job that needs the finalize
    # jobs is skipped whenever they are — which is exactly the case this guard
    # exists to report, since an earlier failure skips every later stage
    # silently. Running unconditionally at the end of the pipeline means the
    # release is always judged out loud, pass or fail.
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: always
  before_script:
    # The tagged commit predates the schema and changelog-link commit that the
    # schema job pushes to master, so check master rather than the tag.
    - git fetch origin master --quiet
    - git checkout origin/master -- docs/about/CHANGELOG.md docs/API
  script:
    - python3 scripts/verify-release-complete.py "$CI_COMMIT_TAG"

Announce release on Slack:
  extends: .rules-rc-release
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  stage: finalize
  needs:
    - job: "Generate consolidated changelog"
    - job: "Deploy MkDocs pages"
      optional: true
  before_script:
    - git fetch origin master --quiet
    - git checkout origin/master -- docs/about/CHANGELOG.md
  script:
    - VERSION="$CI_COMMIT_TAG"
    - DATE=$(grep -m1 "^## ${VERSION} - " docs/about/CHANGELOG.md | sed 's/.* - //')
    - |
      if [ -z "$DATE" ]; then
        echo "Could not find changelog entry for $VERSION — skipping Slack notification."
        exit 0
      fi
    - ANCHOR="$(echo "$VERSION" | tr -d '.' | tr 'A-Z' 'a-z')-${DATE}"
    - URL="https://docs.waldur.com/latest/about/CHANGELOG/"
    - |
      case "$VERSION" in
        *-rc*)
          echo "This is a Release Candidate ($VERSION). Skipping public URL live check."
          ;;
        *)
          echo "Waiting for anchor #${ANCHOR} to appear at ${URL} ..."
          ok=0
          attempts=30
          for i in $(seq 1 "$attempts"); do
            if curl -sf --max-time 10 \
                 -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
                 "${URL}?ts=$(date +%s)" | grep -q "id=\"${ANCHOR}\""; then
              echo "Anchor ${ANCHOR} is live (attempt $i)"
              ok=1
              break
            fi
            echo "Anchor not yet live (attempt $i/${attempts}); sleeping 30s"
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "Anchor ${ANCHOR} never appeared after 15 minutes; skipping Slack notification."
            echo "The job can be re-run manually from GitLab once docs.waldur.com/latest is rebuilt."
            exit 0
          fi
          ;;
      esac
    - python3 scripts/publish-release-slack.py "$VERSION"
