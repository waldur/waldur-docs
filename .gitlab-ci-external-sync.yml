# GitLab CI/CD configuration for external documentation synchronization

variables:
  # Python environment for running sync scripts
  PYTHON_IMAGE: "python:3.13-slim"

# Validation job - runs on all branches and MRs
validate-external-sync:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update && apt-get install -y git
    - pip install pyyaml
  script:
    - python scripts/validate-external-sync.py
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      allow_failure: true # TODO: remove after testing
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: false

# Dry-run sync job - runs on merge requests to preview changes
sync-external-docs-dry-run:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update && apt-get install -y git
    - pip install pyyaml
  script:
    # Run the sync in dry-run mode
    - python scripts/sync-external-docs.py --dry-run
    # Show what would be changed
    - |
      if [ -n "$(git status --porcelain)" ]; then
        echo "📋 Changes that would be committed:"
        git diff --stat
        echo ""
        echo "🔍 Detailed changes:"
        git diff
        echo ""
        echo "ℹ️ This is a dry-run. No changes will be committed on merge requests."
      else
        echo "✅ No changes detected - external docs are up to date"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_TOKEN'
  allow_failure: true

# Sync job - runs on master branch commits and scheduled pipelines
sync-external-docs:
  stage: release
  # Pushes to the default branch. Without a resource group, two pipelines on
  # master overlap and one loses the push with `non-fast-forward` — which is
  # exactly what happened during the 8.1.0 release. Shared with the schema
  # commit job in .gitlab-ci.yml, which pushes the same ref.
  resource_group: master-push
  # Not $PYTHON_IMAGE: this job builds the docs before pushing (see below), so it
  # needs the same full image as "Test mkdocs" rather than the slim one.
  image: registry.hpc.ut.ee/mirror/library/python:3.13
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - apt-get update && apt-get install -y git
    - pip install pyyaml
    # Configure git for commits
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Configure authentication for pushing
    - git remote set-url origin https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
  script:
    # Run the sync
    - python scripts/sync-external-docs.py
    # Nothing to do if the sources have not moved
    - |
      if [ -z "$(git status --porcelain)" ]; then
        echo "✅ No changes detected - external docs are up to date"
        exit 0
      fi
    # Commit before building, not after: the build below writes .venv/ and the
    # site directory into the working tree, and this commit sweeps with
    # `git add .`. Nothing is pushed until the build passes.
    - |
      echo "Changes detected, committing..."
      git add .
      git commit -m "Sync external documentation

      Updated documentation from external sources:
      - HomePort UI docs
      - MasterMind API docs
      - Integration docs

      Automated sync from CI/CD pipeline.
      Pipeline: $CI_PIPELINE_URL"
    # Build what the sync just produced, before it reaches master. The push
    # below uses CI_JOB_TOKEN, which by design starts no pipeline, so
    # "Test mkdocs" never sees this commit — an upstream page that links to a
    # path outside the synced subtree would otherwise land on master unbuilt and
    # fail the next unrelated merge request instead of failing here.
    #
    # These steps mirror .setup_mkdocs_steps in .gitlab-ci.yml. YAML anchors do
    # not cross `include:` boundaries, so they are repeated rather than shared.
    # llms-full.txt is deliberately not regenerated: it is committed to the repo
    # and would enlarge the sync commit with a derived file.
    - pip install uv
    - uv sync --frozen
    - uv pip install --reinstall --no-deps mkdocs-materialx
    - curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
    - export PATH="$HOME/.local/bin:$PATH"
    # `test/` is gitignored, so the build output cannot reach the commit above.
    - uv run mkdocs build --strict --site-dir test
    - git push origin HEAD:$CI_COMMIT_REF_NAME
    - echo "✅ External documentation synchronized and committed"

# Job to validate sync after changes
post-sync-validation:
  stage: release
  image: $PYTHON_IMAGE
  before_script:
    - apt-get update && apt-get install -y git
    - pip install pyyaml
  script:
    - python scripts/validate-external-sync.py --report sync-report.txt
    # Also run the documentation linting to ensure everything is still valid
    # - if [ -f "lint-markdown.mjs" ]; then
    #     apt-get install -y nodejs npm &&
    #     npm install &&
    #     node lint-markdown.mjs;
    #   fi
  rules:
    - if: '$BUILD_SDK == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_TOKEN && $CI_PIPELINE_SOURCE == "push"'
  artifacts:
    when: always
    paths:
      - sync-report.txt
    expire_in: 7 days
  needs:
    - job: sync-external-docs
      optional: true
